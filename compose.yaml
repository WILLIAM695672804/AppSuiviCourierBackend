# Services de developpement uniquement.
#
# La production est hebergee sur site (RNF-SOUV-01) et ne se deploie pas avec
# ce fichier : voir docs/exploitation/runbook.md.

services:
  base:
    # PostgreSQL 16 minimum : partitionnement declaratif, contraintes
    # d'exclusion GiST, TSVECTOR. Le schema ne s'applique pas en dessous.
    image: postgres:16
    environment:
      POSTGRES_DB: suivi
      POSTGRES_USER: suivi
      POSTGRES_PASSWORD: suivi
    ports: ["5432:5432"]
    volumes: ["donnees:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suivi"]
      interval: 5s
      retries: 10

  file:
    # Courtier des taches differees : recalcul nocturne des etats, relances.
    image: redis:7-alpine
    ports: ["6379:6379"]

  stockage:
    # Les pieces jointes ne sont jamais en base. MinIO tient le role du
    # stockage objet souverain, sur site.
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: suivi
      MINIO_ROOT_PASSWORD: suivi-developpement
    ports: ["9000:9000", "9001:9001"]
    volumes: ["pieces:/data"]

volumes:
  donnees:
  pieces:
